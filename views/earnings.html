<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Earnings</title>
  <link rel="icon" href="/brand/favicon-light.ico" media="(prefers-color-scheme: light)">
  <link rel="icon" href="/brand/favicon-dark.ico" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="/brand/autowerke-icon-light.png">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/admin.css">
  <link rel="stylesheet" href="/earnings.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap">
  <link rel="stylesheet" href="/theme.css">
</head>
<body class="theme" data-page="earnings">
  <main class="admin-wrap earnings-wrap">


    <header class="band">
      <div class="band-title">
        <h1>Earnings</h1>
        <div class="band-sub">Finance · projects · signed-off support · domain fees</div>
      </div>
      <div class="band-stats"></div>
    </header>
    <p class="page-note">Amounts are stored excl. VAT; switch the view below. Support is always shown without VAT. Domains count your service fee only.</p>

    <div class="filter-bar">
      <div class="seg" data-filter="type">
        <button data-value="all" class="on">All</button>
        <button data-value="project">Projects</button>
        <button data-value="support">Support</button>
        <button data-value="domain">Domains</button>
        <button data-value="consultancy">Consultancy</button>
      </div>
      <select id="rangeSelect" aria-label="Period">
        <option value="month">This month</option>
        <option value="3m">Last 3 months</option>
        <option value="12m" selected>Last 12 months</option>
        <option value="ytd">Year to date</option>
        <option value="all">All time</option>
      </select>
      <select id="companySelect" aria-label="Company"><option value="">All companies</option></select>
      <div class="seg" data-filter="vat">
        <button data-value="excl" class="on">Excl. VAT</button>
        <button data-value="incl">Incl. VAT</button>
      </div>
    </div>

    <div id="missingBox"></div>
    <div id="content"><p class="empty-state">Loading...</p></div>
  </main>

  <script src="/admin-shell.js"></script>
  <script src="/analytics-core.js"></script>
  <script src="/earnings.js"></script>
  <script src="/admin-health.js"></script>
</body>
</html>
