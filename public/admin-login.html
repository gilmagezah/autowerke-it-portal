<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin centre sign-in — AutoWerke | IT</title>
  <link rel="icon" href="/brand/favicon-light.ico" media="(prefers-color-scheme: light)">
  <link rel="icon" href="/brand/favicon-dark.ico" media="(prefers-color-scheme: dark)">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600&display=swap">
  <link rel="stylesheet" href="/admin-login.css?v=si1">
  <script src="/theme-mode.js"></script>
</head>
<body class="signin">
  <main class="si-main">
    <div class="si-column">
      <img class="si-logo" src="/brand/autowerke-it-logo-light.svg" alt="AutoWerke | IT" width="196" height="30" data-logo>

      <div class="si-card">
        <!-- Step 1: email and password -->
        <section id="pwStep" aria-labelledby="pwTitle">
          <div class="si-head">
            <div class="si-steps" role="img" aria-label="Step 1 of 2"><span class="on"></span><span></span></div>
            <div class="si-titles">
              <h1 id="pwTitle">Sign in to the admin centre</h1>
              <p class="si-eyebrow">Secure sign in · Step 1 of 2</p>
            </div>
          </div>
          <form id="pwForm" class="si-form" novalidate>
            <div class="si-field">
              <label for="email">Email</label>
              <input id="email" type="email" autocomplete="username" placeholder="you@autowerkeit.com" required>
            </div>
            <div class="si-field">
              <label for="password">Password</label>
              <div class="si-pass">
                <input id="password" type="password" autocomplete="current-password" required>
                <button type="button" class="si-eye" id="showPw" aria-label="Show password" aria-pressed="false">
                  <svg class="eye-open" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
                  <svg class="eye-shut" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.4 10.4 0 0 1 12 5c6.5 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.2M6.6 6.6C3.7 8.4 2 12 2 12s3.5 7 10 7c1.7 0 3.2-.5 4.5-1.2"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
                </button>
              </div>
            </div>
            <button type="submit" class="si-btn" id="pwBtn">Continue</button>
          </form>
        </section>

        <!-- Step 2: the emailed code -->
        <section id="codeStep" class="hidden" aria-labelledby="codeTitle">
          <div class="si-head">
            <div class="si-steps" role="img" aria-label="Step 2 of 2"><span class="on"></span><span class="on"></span></div>
            <div class="si-titles">
              <h1 id="codeTitle" tabindex="-1">Check your email</h1>
              <p class="si-eyebrow">Secure sign in · Step 2 of 2</p>
              <p class="si-lead">We sent a 6-letter code to <strong id="sentTo"></strong>. It expires in <span id="mins">10</span> minutes.</p>
            </div>
          </div>
          <form id="codeForm" class="si-form" novalidate>
            <fieldset class="si-code">
              <legend>Sign-in code</legend>
              <div id="codeBoxes"></div>
            </fieldset>
            <button type="submit" class="si-btn" id="codeBtn">Verify and sign in</button>
            <div class="si-row">
              <button type="button" class="si-link" id="resendBtn" disabled>Resend code</button>
              <button type="button" class="si-link" id="backBtn">Use a different account</button>
            </div>
          </form>
        </section>

        <p class="si-msg" id="msg" role="alert"></p>
      </div>

      <p class="si-foot">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
        <span id="footNote">Sessions end after 30 minutes of inactivity.</span>
      </p>
    </div>
  </main>

  <footer class="si-footer">
    <div class="si-footer-in">
      <span>© <span id="year">2026</span> AutoWerke | IT · Harare, Zimbabwe</span>
      <span class="si-legal"><a href="/privacy">Privacy</a><a href="/cookies">Cookies</a><a href="/terms">Terms</a><a href="/service-terms">Service terms</a></span>
    </div>
  </footer>
  <script src="/code-input.js"></script>
  <script src="/admin-login.js?v=si1"></script>
</body>
</html>
